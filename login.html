<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Axyn | Login</title>
<link rel="stylesheet" href="style.css">
</head>
<body class="login-page">
<div class="login-decoration"></div>
<div class="login-card">
<a class="logo login-logo" href="index.html"><span>〰</span> Axyn</a>
<p class="login-subtitle">Sistema de Monitoramento de Filtragem de Ar</p>
<h1>Bem-vindo(a) de volta</h1>
<p>Acesse sua conta para continuar.</p>
<form onsubmit="loginDemo(event)">
<label>E-mail ou usuário<input type="text" required placeholder="Digite seu usuário"></label>
<label>Senha<input type="password" required placeholder="Digite sua senha"></label>
<div class="login-options"><label class="check"><input type="checkbox"> Lembrar de mim</label><a href="#">Esqueci minha senha</a></div>
<button class="btn btn-blue full" type="submit">Entrar</button>
</form>
<div class="or"><span>ou</span></div>
<a class="btn btn-outline full" href="#">Criar conta</a>
<small>Axyn — Tecnologia e qualidade do ar.</small>
</div>
<script src="script.js"></script>
</body>
</html>
